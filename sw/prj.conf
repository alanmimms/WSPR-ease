# WSPR-ease Zephyr Configuration
# Target: ESP32-S3

# Basic kernel settings
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=131072

# C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Console/Shell (USB serial)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_REBOOT=y
CONFIG_SHELL_PROMPT_UART="WSPR-ease> "

# GPIO for status LEDs and FPGA control
CONFIG_GPIO=y

# SPI for FPGA communication
CONFIG_SPI=y
CONFIG_SPI_SHELL=y
CONFIG_SPI_SHELL_MAX_DEVICE_SLOTS=16

# I2C for Si5351 communication
CONFIG_I2C=y

# Wi-Fi
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_IPV4=y
CONFIG_NET_STATISTICS_IPV6=y
CONFIG_NET_STATISTICS_IPV6_ND=y
CONFIG_NET_STATISTICS_ICMP=y
CONFIG_NET_STATISTICS_UDP=y
CONFIG_NET_STATISTICS_TCP=y
CONFIG_NET_STATISTICS_MLD=y
CONFIG_NET_STATISTICS_IGMP=y
CONFIG_NET_STATISTICS_DNS=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_NET_STATISTICS_WIFI=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y

# Network shell for debugging
CONFIG_NET_SHELL=y

# DHCP client (for STA mode)
CONFIG_NET_DHCPV4=y

# DHCP server (for AP mode)
CONFIG_NET_DHCPV4_SERVER=y

# DNS client
CONFIG_DNS_RESOLVER=y

# Network buffers
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=16

# NVS for storing WiFi credentials
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# LittleFS for web UI files
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# Settings subsystem for persistent config
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Increase stack sizes for network threads
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# Floating point support for GNSS coordinates
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Serial/UART
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# WiFi AP mode support - static IP configured in code for AP mode only
# Don't use NET_CONFIG_SETTINGS as it interferes with DHCP client mode

# WSPR-ease WiFi Configuration
# Set these to connect to your WiFi network as a client
# Leave WSPR_WIFI_SSID empty to start in AP mode
CONFIG_WSPR_WIFI_SSID="Starview"
CONFIG_WSPR_WIFI_PASSWORD="8784.brd3.14"

# AP mode settings (used when client mode fails or is not configured)
CONFIG_WSPR_AP_SSID="WSPR-ease"
CONFIG_WSPR_AP_PASSWORD="wspradmin"
